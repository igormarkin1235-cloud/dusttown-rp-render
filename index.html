    <script>
      window.addEventListener('error', function(e) {
        var box = document.getElementById('init-error-banner');
        if (box) {
          box.style.display = 'block';
          box.innerText = 'Сбой скрипта: ' + (e.message || e.error || 'Unknown error');
        }
      });
    </script>

  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-amber-500/30 selection:text-amber-200 min-h-screen">
